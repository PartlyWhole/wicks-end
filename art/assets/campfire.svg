        <path fill="#fff0c8" d="M-1.4,-1.6 L1.2,-1.4 L1.6,0.8 L-0.4,1.8 L-1.8,0.4 Z"/>
      </g>
    </g>

    <!-- rear log re-inked in front of the flame foot, then tinted (holes stay open) -->
    <use href="#log-right" fill="#0b0907" fill-rule="evenodd"/>
    <path fill="#5a3a24" fill-rule="evenodd" d="M113.5,181.3 L124.8,187.8 L188,216.4 C189.5,219 187,225.5 183.4,227.4 L121.2,195 L109.5,190.1 A11.5,11.5 0 0 0 113.5,181.3 Z
      M159.5,208 L168.5,209.8 L163.2,211 L167,213.8 L159.8,211.2 Z"/>
    <path fill="#8a5a36" fill-rule="evenodd" d="M108.5,181.5 C108.5,185.2 105.6,188 101.9,188 C98.3,188 95.5,185.1 95.5,181.5 C95.5,177.9 98.4,175 102,175 C105.7,175 108.5,177.9 108.5,181.5 Z
