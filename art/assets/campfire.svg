      M103.4,181.5 A1.4,1.4 0 1 0 100.6,181.5 A1.4,1.4 0 1 0 103.4,181.5 Z"/>

    <!-- front log re-inked over the rear tint: its border cuts the joint -->
    <use href="#log-left" fill="#0b0907" fill-rule="evenodd"/>
    <path fill="#5a3a24" fill-rule="evenodd" d="M67,216.8 L121,187.9 L150,169.9 A11.5,11.5 0 0 0 155.6,178.5 L125,194.9 L73,227.2 C70,227.6 66.4,224.6 66,221 C65.8,219 66.2,217.6 67,216.8 Z
      M94.5,207.5 C95.5,203.5 101,202.5 103.5,205 C100.5,204.6 97.6,205.6 97,208.4 C96.6,209.8 95.2,209.6 94.5,207.5 Z"/>
    <path fill="#8a5a36" fill-rule="evenodd" d="M168,169 C168,172.7 165.1,175.5 161.4,175.5 C157.8,175.5 155,172.6 155,169 C155,165.4 157.9,162.5 161.5,162.5 C165.2,162.5 168,165.4 168,169 Z
      M164.7,169 A3.2,3.2 0 1 0 158.3,169 A3.2,3.2 0 1 0 164.7,169 Z
      M162.9,169 A1.4,1.4 0 1 0 160.1,169 A1.4,1.4 0 1 0 162.9,169 Z"/>

    <!-- front stones re-inked so they sit before the logs and back stones -->
    <g fill="#0b0907" fill-rule="evenodd">
      <use href="#stone-a"/><use href="#stone-b"/><use href="#stone-c"/><use href="#stone-d"/><use href="#stone-e"/>
    </g>
    <!-- ===== STONE TINTS ===== -->
    <use href="#stone-a" fill="#8a8a80" transform="translate(64.75 221.6) scale(0.8 0.72) translate(-64.75 -221.6)"/>
    <use href="#stone-b" fill="#5b6f7a" transform="translate(88.6 228) scale(0.71 0.6) translate(-88.6 -228)"/>
    <path fill="#8a8a80" fill-rule="evenodd" d="M102.2,232.8 L103.4,227 L108.4,222.4 L116.2,220.6 L124.4,221.1 L129,224.2 L131,229.2 L129.4,233.2 L121.8,234.5 L106.5,234.3 Z
      M114,221.8 L116.4,222.2 L116.9,224.8 L117.5,226.2 L121.4,225.2 L118,227.4 L118.6,231.8 L116.1,228.2 L114.8,225 Z"/>
    <path fill="#5b6f7a" d="M139.3,232.8 L139.8,221.5 L143.2,213 L147.2,209.6 L150,210.2 L155.8,219 L156.2,229 L153.8,232.8 L143,233.2 Z"/>
    <path fill="#8a8a80" d="M150,210.2 L155.8,219 L152.4,219.6 L147.8,212.4 Z"/>
    <use href="#stone-e" fill="#8a8a80" transform="translate(172.1 222) scale(0.79 0.72) translate(-172.1 -222)"/>

