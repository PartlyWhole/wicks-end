            <g transform="translate(-128 -200)"><path fill="#f2a94a" d="M102,200 C96,182 106,166 113,154 C119,142 121,124 127,104 C138,118 143,136 140,156 C145,151 150,146 154,141 C161,162 158,184 149,200 C134,203.5 115,203.5 102,200 Z">
