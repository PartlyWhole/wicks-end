              keyTimes="0;0.4;0.75;1" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"
              values="M102,200 C96,182 106,166 113,154 C119,142 121,124 127,104 C138,118 143,136 140,156 C145,151 150,146 154,141 C161,162 158,184 149,200 C134,203.5 115,203.5 102,200 Z;
                      M102,200 C97,182 108,166 115,154 C122,142 126,122 133,100 C141,116 145,136 143,156 C148,152 154,148 158,146 C161,166 158,186 149,200 C134,203.5 115,203.5 102,200 Z;
