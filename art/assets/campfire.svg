        <animateTransform attributeName="transform" type="skewX" dur="0.55s" repeatCount="indefinite" calcMode="spline" values="0;-5;5;0" keyTimes="0;0.33;0.66;1" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
        <g transform="translate(-132 -200)"><path fill="#fff0c8" d="M112,200 C107,186 116,174 121,162 C125,152 127,142 129,130 C137,144 143,158 141,174 C144,170 147,166 148,161 C153,176 151,193 144,200 C133,202.5 121,202.5 112,200 Z">
