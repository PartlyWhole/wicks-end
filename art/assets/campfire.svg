                      M97,200 C92,186 98,172 104,162 C108,157 110,152 108,148 C116,152 121,160 119,172 C123,152 124,130 129,114 C131,108 131,104 130,100 C136,108 139,116 139,126 C142,118 146,112 148,104 C153,114 151,126 147,138 C152,134 158,132 165,130 C168,148 167,170 160,186 C158,193 156,197 154,200 C140,204 114,204 97,200 Z;
                      M97,200 C92,186 97,172 102,162 C104,156 102,150 99,146 C110,150 119,158 118,172 C120,150 116,128 118,112 C119,106 118,101 116,98 C124,104 129,114 131,124 C132,116 134,110 134,104 C141,114 145,126 145,138 C149,130 153,124 157,120 C164,140 166,170 160,186 C158,193 156,197 154,200 C140,204 114,204 97,200 Z;
                      M97,200 C92,186 97,172 103,162 C106,156 106,150 104,144 C113,150 119,160 118,172 C121,152 120,128 124,110 C125,104 125,100 124,96 C131,104 134,114 135,124 C137,116 140,110 141,102 C147,112 148,124 146,138 C151,132 156,128 161,124 C167,144 167,170 160,186 C158,193 156,197 154,200 C140,204 114,204 97,200 Z"/>
            </path></g></g></g>
