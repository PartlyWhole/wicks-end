        <g transform="translate(-128 -200)">
          <!-- deep red outer flame: 2.2 s, pivot x 124, split top into two slim tongues -->
          <g transform="translate(124 200)"><g>
            <animateTransform attributeName="transform" type="skewX" dur="2.2s" repeatCount="indefinite" calcMode="spline" values="0;-5;4;0" keyTimes="0;0.4;0.75;1" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
