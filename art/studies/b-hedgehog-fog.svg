<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" data-duration="4">
  <!-- Direction B · Hedgehog-in-the-Hollow: layered tracing-paper fog; the lamp clears it -->
  <defs>
    <radialGradient id="clear" cx="172" cy="150" r="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000"/>
      <stop offset=".45" stop-color="#000"/>
      <stop offset="1" stop-color="#fff"/>
    </radialGradient>
    <mask id="fogmask"><rect width="256" height="256" fill="url(#clear)"/></mask>
    <radialGradient id="warm" cx="172" cy="150" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e9b665" stop-opacity=".75"/>
      <stop offset="1" stop-color="#e9b665" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="softer"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="256" height="256" fill="#23343a"/>
  <!-- far fog layer with a distant, half-seen tree -->
  <g filter="url(#softer)" opacity=".5">
    <path d="M20 200 C24 160 18 130 30 100 C22 90 14 84 10 72 M30 100 C38 86 50 80 60 78" stroke="#3b2f28" stroke-width="6" fill="none"/>
  </g>
  <rect y="120" width="256" height="136" fill="#c9cdc4" opacity=".16"/>
  <!-- ground -->
  <path d="M0 212 C70 204 150 208 256 202 L256 256 L0 256Z" fill="#4c5a45"/>
  <path d="M0 222 C80 216 160 220 256 214" stroke="#2a2a2e" stroke-width="1.2" fill="none" opacity=".6"/>

  <!-- Rackham tree: gnarled, variable-width ink, sepia wash -->
  <g transform="translate(24 0)">
    <path d="M58 214 C62 184 54 156 66 128 C54 112 38 104 30 90 C42 96 54 100 64 106 C62 86 50 70 54 48 C62 66 70 78 74 96 C80 72 94 58 110 52 C100 70 88 86 86 108 C96 102 110 100 122 104 C106 110 92 118 86 132 C82 160 88 190 96 214Z" fill="#3b2f28" stroke="#2a2a2e" stroke-width="2" stroke-linejoin="round"/>
    <path d="M70 140 c4 8 2 18 -2 26 M78 118 c-4 10 -2 22 2 30 M66 190 c3 -8 8 -12 12 -12" stroke="#b89a6e" stroke-width="1.3" fill="none" opacity=".7"/>
    <!-- a knot that almost reads as a face -->
    <path d="M74 150 c3 -3 6 -3 8 0 M86 150 c3 -3 5 -3 7 0 M78 162 c4 3 8 3 11 0" stroke="#1a1410" stroke-width="1.6" fill="none" opacity=".55"/>
  </g>

  <!-- warmth of the lantern -->
  <circle cx="172" cy="150" r="80" fill="url(#warm)">
    <animate attributeName="r" dur="1.3s" repeatCount="indefinite" values="80;86;78;80"/>
  </circle>

  <!-- Silas: pale, rounded, fine-lined; the character IS the warmth -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" values="0 0;0 -1.5;0 0"/>
    <g stroke="#2a2a2e" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
      <path d="M142 212 l2 -32 M156 212 l-1 -32" fill="none" stroke-width="3"/>
      <path d="M132 182 C132 150 138 128 150 122 C162 128 168 150 168 182 C156 188 144 188 132 182Z" fill="#f4f1e8"/>
      <circle cx="150" cy="104" r="16" fill="#f4f1e8"/>
      <path d="M136 98 C138 84 162 82 166 96 L172 98 L138 102Z" fill="#9fb3c4"/>
      <circle cx="156" cy="104" r="1.8" fill="#2a2a2e" stroke="none"/>
      <path d="M140 122 C150 128 160 126 164 120" stroke="#b89a6e" stroke-width="4" fill="none"/>
      <path d="M160 132 C168 136 172 142 172 146" fill="none" stroke-width="3"/>
    </g>
  </g>
  <!-- lantern -->
  <path d="M166 146 h12 l-2 16 h-8z" fill="#e9b665" stroke="#2a2a2e" stroke-width="1.6"/>
  <circle cx="172" cy="154" r="3" fill="#fff6dc"><animate attributeName="r" dur="0.7s" repeatCount="indefinite" values="3;3.6;2.6;3"/></circle>

  <!-- near fog layers drift (co-prime durations), masked away inside the lamp's reach -->
  <g mask="url(#fogmask)" filter="url(#soft)">
    <ellipse cx="80" cy="190" rx="120" ry="18" fill="#c9cdc4" opacity=".35">
      <animate attributeName="cx" dur="4s" repeatCount="indefinite" values="80;96;80"/>
    </ellipse>
    <ellipse cx="200" cy="150" rx="110" ry="14" fill="#c9cdc4" opacity=".28">
      <animate attributeName="cx" dur="4s" repeatCount="indefinite" values="200;184;200"/>
    </ellipse>
    <ellipse cx="120" cy="226" rx="150" ry="16" fill="#c9cdc4" opacity=".4">
      <animate attributeName="cx" dur="2s" repeatCount="indefinite" values="120;130;120"/>
    </ellipse>
    <!-- the Hush's colour: a Prussian-blue shape that exists only in the fog -->
    <ellipse cx="236" cy="176" rx="26" ry="40" fill="#1f3a5f" opacity=".75">
      <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values=".75;.4;.75"/>
    </ellipse>
    <circle cx="232" cy="166" r="2.2" fill="#c9cdc4"/><circle cx="242" cy="164" r="1.8" fill="#c9cdc4"/>
  </g>
</svg>
